<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Member Area | Change Bible Church Sandton</title>
<link rel="preload" href="assets/fonts/archivo-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/fraunces-roman-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="admin.css">
<link rel="icon" href="assets/emblem.svg" type="image/svg+xml">
<link rel="icon" href="assets/icon-192.png" sizes="192x192" type="image/png">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CBC Sandton">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>

<header class="site-nav">
  <div class="nav-inner">
    <a class="brand" href="index.html">
      <img src="assets/emblem.svg" alt="" width="34" height="34">
      <span class="brand-text">
        <span class="name">CBC SANDTON</span><br>
        <span class="place">Member area</span>
      </span>
    </a>
    <div class="admin-nav">
      <a class="btn btn-outline btn-sm" href="index.html">View site</a>
      <button class="btn btn-outline btn-sm" id="signout" type="button" hidden>Sign out</button>
    </div>
  </div>
</header>

<main class="admin" id="main">

  <section class="admin-card narrow" id="loading-view">
    <p class="muted">Loading&hellip;</p>
  </section>

  <section class="admin-card narrow" id="notice-view" hidden>
    <h1 id="notice-title"></h1>
    <p id="notice-body" class="muted"></p>
  </section>

  <section id="app-view" hidden>
    <div class="admin-head">
      <div>
        <h1 id="welcome">Welcome</h1>
        <p class="muted" id="since"></p>
      </div>
    </div>

    <div class="member-grid">
      <section class="admin-card" aria-labelledby="details-title">
        <h2 id="details-title">Your details</h2>
        <form id="details-form" novalidate>
          <div class="field">
            <label for="d-name">Full name</label>
            <input id="d-name" type="text" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="d-phone">Phone</label>
            <input id="d-phone" type="tel" autocomplete="tel">
          </div>
          <div class="field">
            <label for="d-email">Email</label>
            <input id="d-email" type="email" readonly>
            <p class="hint">To change your email address, please ask the church office.</p>
          </div>
          <button class="btn btn-gold" type="submit" id="d-save">Save changes</button>
          <p class="form-status" id="d-status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="notices" aria-labelledby="notices-title">
        <h2 id="notices-title">Church notices</h2>
        <div id="notice-list"></div>
        <p class="empty" id="notice-empty" hidden>No notices right now. Check back soon.</p>
      </section>
    </div>
  </section>

</main>

<script src="site.config.js"></script>
<script src="api.js"></script>
<script src="demo.js"></script>
<script src="member.js"></script>
<script src="pwa.js" defer></script>
</body>
</html>
